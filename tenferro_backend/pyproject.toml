[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "artensor-tenferro"
version = "0.1.0"
description = "tenferro (Rust) contraction backend for artensor"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.9"
dependencies = ["numpy"]

[tool.maturin]
module-name = "artensor_tenferro"
